<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>WTF SIMULATOR</title>
<link rel="icon" href="data:," />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3ff; font-family: "Segoe UI", sans-serif; }
  #hud, #players { position: fixed; color: #fff; text-shadow: 0 1px 3px #000; pointer-events: none; white-space: pre; }
  #hud { top: 12px; left: 12px; white-space: pre-wrap; max-width: calc(100vw - 190px); }
  #players { top: 12px; right: 12px; text-align: right; max-height: 40vh; overflow: hidden; }
  #pause { position: fixed; inset: 0; align-items: center; justify-content: center; background: rgba(20, 40, 70, 0.55); cursor: pointer; }
  #pause #card { cursor: default; width: 440px; max-width: 94vw; }
  #pauseInfo { font-size: 14px; color: #2c3e50; margin: 0 0 14px; }
  #pauseInfo .addr { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 8px; }
  #pauseInfo code { background: #eef3f8; padding: 6px 8px; border-radius: 6px; font-size: 15px; }
  #pause #pauseInfo button { width: auto; margin: 0; padding: 7px 10px; font-size: 13px; background: #3498db; }
  #pause #options { background: #3498db; margin-bottom: 10px; }
  #pause #back { background: #7f8c8d; }
  #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(40, 90, 140, 0.55); }
  #card { background: #fff; padding: 28px 32px; border-radius: 14px; text-align: center; width: 300px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
  #card h1 { margin: 0 0 6px; font-size: 26px; color: #2c3e50; }
  #card p { margin: 0 0 16px; color: #667; font-size: 14px; }
  #card input { width: 100%; box-sizing: border-box; padding: 10px; font-size: 16px; border: 2px solid #cfd8e3; border-radius: 8px; margin-bottom: 12px; }
  #card button { width: 100%; padding: 12px; font-size: 17px; font-weight: bold; color: #fff; background: #e74c3c; border: 0; border-radius: 8px; cursor: pointer; }
  #card button:hover { background: #d63c2c; }
  #status { margin-top: 10px; min-height: 18px; color: #c0392b; font-size: 14px; }

  /* Chat */
  #chat { position: fixed; left: 12px; bottom: 176px; width: min(460px, 60vw); display: none; pointer-events: none; }
  #chatLog { max-height: 160px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; font-size: 15px; color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 2px #000; }
  #chatLog div { padding: 2px 8px; background: rgba(0, 0, 0, 0.35); margin-top: 2px; border-radius: 4px; word-break: break-word; transition: opacity .6s; }
  #chatLog .sys { color: #ffe9a6; font-style: italic; }
  #chatLog .faded { opacity: 0; }
  #chat.open { pointer-events: auto; }
  #chat.open #chatLog { max-height: 260px; overflow-y: auto; }
  #chat.open #chatLog .faded { opacity: 1; }
  #chatInput { display: none; width: 100%; box-sizing: border-box; margin-top: 6px; padding: 9px 10px; font-size: 15px; border: 2px solid #3498db;
    border-radius: 6px; background: rgba(255, 255, 255, 0.95); }
  #chat.open #chatInput { display: block; }

  /* HUD de jeu */
  #crosshair { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1.5px rgba(27,27,43,.75); }
  #crosshair::before { left: 6px; top: 0; width: 2px; height: 14px; }
  #crosshair::after { top: 6px; left: 0; height: 2px; width: 14px; }
  #crosshair.veh { opacity: .75; }
  #vitals { position: fixed; left: 14px; bottom: 96px; width: 220px; pointer-events: none; font-weight: 800; color: #fff; text-shadow: 0 1px 3px #000; }
  .bar { position: relative; height: 18px; border-radius: 9px; background: rgba(27,27,43,.7); border: 2px solid #1b1b2b; overflow: hidden; margin-top: 6px; }
  .bar > div:first-child { height: 100%; width: 100%; transition: width .15s; }
  .bar > span { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 18px; }
  #hpFill { background: #4cd964; }
  #hotbar { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; pointer-events: none; }
  #hotbar.dim { opacity: .5; }
  .slot { position: relative; width: 62px; height: 62px; box-sizing: border-box; border-radius: 10px; background: rgba(27,27,43,.72); border: 3px solid #1b1b2b;
    display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-shadow: 0 1px 2px #000; cursor: pointer; }
  .slot .emoji { font-size: 26px; line-height: 28px; }
  .slot .nm { font-size: 10px; font-weight: 700; max-width: 56px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .slot .num { position: absolute; left: 4px; top: 1px; font-size: 11px; font-weight: 800; color: #ffe066; }
  .slot.sel { border-color: #ffe066; background: rgba(255,224,102,.28); box-shadow: 0 0 12px #ffe066; transform: translateY(-5px); }
  #itemInfo { position: fixed; left: 50%; bottom: 86px; transform: translateX(-50%); text-align: center; color: #fff; text-shadow: 0 1px 3px #000, 0 0 2px #000; pointer-events: none; max-width: 60vw; }
  #itemInfo .t { display: block; font-size: 17px; font-weight: 800; }
  #itemInfo .d { display: block; font-size: 13px; opacity: .9; }
  #damage { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255,0,0,0) 35%, rgba(255,20,20,.9) 100%); }

  @media (max-width: 760px) { .slot { width: 48px; height: 52px; } .slot .emoji { font-size: 20px; } .slot .nm { font-size: 8px; max-width: 44px; } #hotbar { gap: 3px; } #itemInfo { bottom: 76px; } #vitals { width: 160px; bottom: 84px; } #chat { bottom: 160px; } }
  @media (max-height: 540px) { #chatLog { max-height: 90px; } #chat.open #chatLog { max-height: 130px; } }

  /* Inventaire */
  #inventory { position: fixed; inset: 0; z-index: 500; align-items: center; justify-content: center; background: rgba(20,40,70,.65); }
  .inv-card { background: #fff; color: #2c3e50; border-radius: 16px; width: 860px; max-width: 96vw; max-height: 92vh; display: flex; flex-direction: column; padding: 16px 20px; box-shadow: 0 10px 40px rgba(0,0,0,.4); }
  .inv-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .inv-head h2 { margin: 0; font-size: 24px; }
  .inv-hint { font-size: 12px; color: #7f8c9a; margin-top: 6px; }
  .inv-empty { padding: 50px; text-align: center; font-size: 20px; color: #7f8c9a; }
  .inv-tabs { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .inv-tab { padding: 6px 14px; border: 2px solid #cfd8e3; border-radius: 16px; background: #f4f8fb; font-weight: 700; color: #2c3e50; cursor: pointer; }
  .inv-tab.on { background: #3498db; border-color: #3498db; color: #fff; }
  .inv-grid { overflow-y: auto; flex: 1; min-height: 120px; padding-right: 6px; }
  .inv-sect { margin: 10px 0 6px; font-size: 12px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #7f8c9a; }
  .inv-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
  .inv-item { align-content: start; text-align: left; border: 2px solid #cfd8e3; border-radius: 10px; background: #f9fbfd; padding: 8px 10px; cursor: pointer; display: grid; grid-template-columns: 38px 1fr; grid-template-rows: auto auto; column-gap: 8px; color: #2c3e50; font-family: inherit; }
  .inv-item:hover { border-color: #3498db; background: #eef6fd; }
  .inv-item .ie { grid-row: 1 / 3; font-size: 30px; align-self: center; text-align: center; }
  .inv-item .in { font-weight: 800; font-size: 14px; }
  .inv-item .id { font-size: 11.5px; color: #667; line-height: 1.25; }
  .inv-bar { display: flex; gap: 6px; justify-content: center; margin-top: 12px; padding-top: 10px; border-top: 2px dashed #dde5ee; }
  .inv-bar .slot { background: #f4f8fb; border-color: #cfd8e3; color: #2c3e50; text-shadow: none; }
  .inv-bar .slot .num { color: #e67e22; }
  .inv-bar .slot.sel { background: #fff4d1; border-color: #f1c40f; box-shadow: 0 0 8px #f1c40f; }
</style>
</head>
<body>
<div id="hud"></div>
<div id="players"></div>
<div id="crosshair"></div>
<div id="vitals">
  <div id="vehBox" style="display:none"><span id="vehLabel" style="font-size:12px"></span><div class="bar"><div id="vehFill"></div></div></div>
  <div class="bar"><div id="hpFill"></div><span id="hpText">100</span></div>
</div>
<div id="itemInfo"></div>
<div id="hotbar"></div>
<div id="damage"></div>
<div id="chat"><div id="chatLog"></div><input id="chatInput" maxlength="200" placeholder="Écris un message, Entrée pour envoyer, Échap pour annuler" autocomplete="off" /></div>
<div id="menu">
  <div id="card">
    <h1>WTF SIMULATOR</h1>
    <p>Monde ouvert · véhicules · entre amis</p>
    <input id="name" maxlength="16" placeholder="Ton pseudo" autofocus />
    <button id="play">Jouer</button>
    <div id="status"></div>
  </div>
</div>
<div id="pause" style="display:none">
  <div id="card">
    <h1>Pause</h1>
    <p>Clique pour reprendre la partie</p>
    <div id="pauseInfo"></div>
    <button id="options">Options</button>
    <button id="back">Menu principal</button>
  </div>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
