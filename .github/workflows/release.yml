# Fabrique les applications (Windows .exe, macOS .dmg Intel + Apple Silicon) et les publie dans les Releases
# quand on pousse un tag "v*" (ex : git tag v0.1.0 && git push --tags).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # pas de signature de code
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Jeu3D-*-portable.exe
            release/Jeu3D-Installer-*.exe

  macos:
    runs-on: macos-latest # fabrique aussi la version Intel (x64) depuis cette machine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # la signature ad hoc est faite par scripts/adhoc-sign.cjs
      - uses: softprops/action-gh-release@v2
        with:
          files: release/Jeu3D-*-mac-*.dmg
